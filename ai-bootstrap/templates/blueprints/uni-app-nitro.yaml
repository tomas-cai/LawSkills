# uni-app-nitro Blueprint v1.1.0
# uni-app (Vue3 + Vant 4 移动端 UI) + Nitro + Drizzle + SQLite/Turso + Vercel AI SDK

id: uni-app-nitro
name: UniApp + Nitro
version: 1.1.0
description: "uni-app 移动端（H5 优先，Vant 4 移动端 UI；小程序可另用 vant-weapp）+ Nitro API + SQLite/Turso + Vercel AI SDK"
author: "AI Bootstrap"
tags: [uni-app, vue3, typescript, vant, nitro, mobile, h5, miniprogram, app, ai]

stack:
  frontend:
    framework: uni-app
    version: "3.x"
    language: typescript
    build_tool: vite
    ui_library: vant + uni-ui
    state_management: pinia

  backend:
    framework: nitro
    package: nitropack
    version: "2.x"
    language: typescript
    orm: drizzle
    api_style: typed rest + server functions

  ai:
    sdk: vercel-ai-sdk
    provider_strategy: model-provider-adapter

  database:
    primary: sqlite
    version: "3"
    production: turso/libsql

  auth:
    provider: jwt
    strategy: bearer + http-only-cookie
    role_model: author

  deployment:
    type: serverless
    platform: "vercel + turso"
    ci: github-actions

  package_manager: pnpm
  monorepo: pnpm-workspace

design_system:
  status: required
  ui_library: vant + uni-ui
  styling: scss + css-variables (--van-*)
  icon_library: uni-icons
  color_mode: light-dark
  token_preset: mobile-coach
  official_paradigm: "Vant 4 官方 starter 范式（vant-ui/vant-demo + quickstart）：常规用法 import 'vant/lib/index.css' + app.use(Button)（官方推荐，Tree Shaking 默认可用）；体积极致时改用 unplugin-vue-components + @vant/auto-import-resolver（VantResolver）按需引入（此时不再引入全量 css）；主题用 700+ 个 --van-* CSS 变量定制（:root 全局覆盖 + van-config-provider theme-vars 组件级）；函数式 API showToast/showDialog；Vant 4 起禁止 babel-plugin-import、禁止全量+按需混用"
  theme_entry:
    framework: apps/mobile/src/App.vue（全局 :root 覆盖 --van-*）
    global_tokens: apps/mobile/src/uni.scss（uni-app 官方 SCSS 变量入口）
    components: van-config-provider theme-vars + Vant CSS 变量
  component_baseline: [button, cell, nav-bar, tabbar, field, list, dialog, empty/error]

layout:
  source_root: apps/
  key_dirs:
    apps/mobile/: "uni-app 移动端（H5 优先，Vant 4；小程序可另用 vant-weapp）"
    apps/mobile/src/pages/: "uni-app 页面与路由"
    apps/mobile/src/components/: "Vue 组件"
    apps/mobile/src/composables/: "组合式函数"
    apps/mobile/src/services/: "feature services 与 Mock/API adapters"
    apps/mobile/src/styles/: "全局样式与语义令牌"
    apps/api/: "Nitro 后端"
    apps/api/server/api/: "Nitro API 路由"
    apps/api/server/utils/: "鉴权与共享逻辑"
    apps/api/db/: "Drizzle schema 与迁移"
    packages/contracts/: "前后端共享 TS 类型"
  conventions: "遵循 uni-app Vue3/Vite 官方目录约定（src/pages.json、src/manifest.json、src/uni.scss、App.vue）与 Vant 4 官方引入范式（常规用法 / VantResolver 按需，二选一）；移动端与 API 独立，共享 packages/contracts。"

commands:
  install: "pnpm install"
  dev: "pnpm dev:mobile"
  test: "pnpm typecheck"

architecture:
  style: layered
  pattern: modular-monolith

starter:
  enabled: true
  mode: mock-first
  template_dirs:
    - dir: uni-app-workspace-root
      target: ""
    - dir: uni-app-mobile
      target: "apps/mobile"
    - dir: nitro-server-standalone
      target: "apps/api"
