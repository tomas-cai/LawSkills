# go-microservice Blueprint v1.0.0
# Go 微服务 + Gin + PostgreSQL + gRPC

id: go-microservice
name: Go Microservice
version: 1.0.0
description: "Go 微服务，使用 Gin 框架 + PostgreSQL + gRPC，适合高性能 API 服务"
author: "AI Bootstrap"
tags: [go, gin, microservice, grpc, docker, api]

stack:
  frontend:
    framework: none
    language: none

  backend:
    framework: gin
    version: "1.10.x"
    language: go
    orm: gorm
    api_style: rest + grpc
    message_queue: nats
    testing: go-test + testify

  database:
    primary: postgres
    version: "16"
    cache: redis

  auth:
    provider: jwt
    strategy: token + api-key

  deployment:
    type: docker + kubernetes
    ci: github-actions
    platform: "docker (dev) + k8s (prod)"
    observability: "prometheus + open-telemetry + grafana"

  package_manager: go-modules
  monorepo: none
  build_tool: makefile

design_system:
  status: not-applicable
  rationale: no frontend is included in this Blueprint

architecture:
  style: clean
  pattern: microservices
  service_mesh: optional
  api_gateway: kong

layout:
  source_root: .
  key_dirs:
    cmd/: "可执行程序入口"
    cmd/server/: "微服务主程序入口"
    internal/: "Go 官方约定的内部包（不可被外部导入）"
    internal/handler/: "HTTP/gRPC handlers"
    internal/service/: "业务服务层"
    internal/repository/: "数据访问层"
    pkg/: "可对外复用的公共包"
    configs/: "配置文件"
    migrations/: "数据库迁移"
  conventions: "遵循 Go 官方模块与 cmd/internal/pkg 约定；业务包按 handler/service/repository 分层。"

commands:
  install: "go mod download"
  dev: "go run ./cmd/server"
  test: "go test ./..."
