# next-fullstack Blueprint v1.0.0
# Next.js 全栈应用 + NestJS 后端 + PostgreSQL

id: next-fullstack
name: Next.js Fullstack
version: 1.0.0
description: "Next.js 全栈应用，配套 NestJS 后端和 PostgreSQL 数据库"
author: "AI Bootstrap"
tags: [nextjs, fullstack, web, ddd, typescript]

stack:
  frontend:
    framework: next
    version: "15.x"
    language: typescript
    ui_library: shadcn
    state_management: zustand
    testing: vitest + playwright

  backend:
    framework: nest
    version: "11.x"
    language: typescript
    orm: prisma
    api_style: rest
    testing: vitest + supertest

  database:
    primary: postgres
    version: "17"
    cache: redis

  auth:
    provider: authjs
    strategy: jwt + session

  deployment:
    type: docker
    ci: github-actions
    platform: "vercel (frontend) + railway (backend)"

  package_manager: pnpm
  monorepo: turbo

design_system:
  status: required
  ui_library: shadcn
  styling: tailwind-css
  icon_library: lucide-react
  color_mode: light-dark
  token_preset: ink-indigo
  official_paradigm: "shadcn/ui v3 官方安装范式（v3.shadcn.com/docs/installation/vite + Tailwind v4）：全局 CSS 以 @import \"tailwindcss\" 起步（Vite 插件 @tailwindcss/vite，tsconfig/vite 配 @/* 路径别名）；pnpm dlx shadcn@latest init 生成 components.json + globals.css 主题变量（--primary / --radius 等 CSS 变量 + 语义类名）与 src/lib/utils.ts（cn()）；组件用 pnpm dlx shadcn@latest add <component> 源码拷贝进 src/components/ui/（不走 babel-plugin-import 或运行时按需插件）；主题色只改 CSS 变量（--primary / --radius），页面不散落 hex 直接覆盖组件默认色"
  theme_entry:
    framework: apps/web/src/app/layout.tsx
    global_tokens: apps/web/src/app/globals.css
    components: apps/web/components/ui variants + semantic Tailwind mappings
  component_baseline: [button, input, card, badge, navigation, dialog, table/list, empty/error]

architecture:
  style: ddd
  pattern: modular-monolith

layout:
  source_root: apps/
  key_dirs:
    apps/web/: "Next.js 前端应用"
    apps/web/app/: "Next.js App Router 页面与路由"
    apps/web/components/: "React 组件"
    apps/web/public/: "公共静态资源"
    apps/api/: "NestJS 后端服务"
    apps/api/src/: "NestJS 模块、控制器与服务"
  conventions: "遵循 Turborepo 官方 monorepo 约定与 Next.js App Router 约定；前端 apps/web，后端 apps/api。"

commands:
  install: "pnpm install"
  dev: "pnpm dev"
  test: "pnpm test"
