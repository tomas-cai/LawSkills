# rust-axum-api Blueprint v1.0.0
# Rust Axum + SQLite + async 高性能 API

id: rust-axum-api
name: Rust Axum API
version: 1.0.0
description: "高性能 Rust API 服务，使用 Axum 框架 + SQLite，适合边缘计算和嵌入场景"
author: "AI Bootstrap"
tags: [rust, axum, sqlite, api, high-performance]

stack:
  frontend:
    framework: none
    language: none

  backend:
    framework: axum
    version: "0.8.x"
    language: rust
    orm: diesel + sqlx
    api_style: rest
    async_runtime: tokio
    testing: cargo-test + rstest

  database:
    primary: sqlite
    version: "3.x"
    migration: diesel-cli

  auth:
    provider: jwt
    strategy: token

  deployment:
    type: docker + binary
    ci: github-actions
    platform: "binary deploy / docker / serverless"

  package_manager: cargo
  monorepo: cargo-workspace

design_system:
  status: not-applicable
  rationale: no frontend is included in this Blueprint

architecture:
  style: layered
  pattern: modular-monolith

layout:
  source_root: src/
  key_dirs:
    src/: "Cargo 官方源码目录"
    src/main.rs: "二进制入口"
    src/routes/: "Axum 路由模块"
    src/handlers/: "请求处理器"
    src/models/: "数据模型"
    src/db/: "SQLite 连接与迁移"
    migrations/: "数据库迁移文件"
  conventions: "遵循 Cargo 官方约定：src/main.rs 为入口；模块按 routes/handlers/models/db 组织。"

commands:
  install: "cargo build"
  dev: "cargo run"
  test: "cargo test"
