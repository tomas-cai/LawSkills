# react-fastapi Blueprint v1.0.0
# React 前端 + FastAPI 后端

id: react-fastapi
name: React + FastAPI
version: 1.0.0
description: "React 前端 (Vite) + FastAPI 后端 + PostgreSQL"
author: "AI Bootstrap"
tags: [react, fastapi, python, typescript, web]

stack:
  frontend:
    framework: react
    version: "19.x"
    language: typescript
    build_tool: vite
    ui_library: shadcn
    testing: vitest

  backend:
    framework: fastapi
    version: "0.115.x"
    language: python
    orm: sqlalchemy
    api_style: rest
    testing: pytest

  database:
    primary: postgres
    version: "17"

  auth:
    provider: jwt
    strategy: token

  deployment:
    type: docker
    ci: github-actions

  package_manager: pnpm + pip
  monorepo: none

design_system:
  status: required
  ui_library: shadcn
  styling: tailwind-css
  icon_library: lucide-react
  color_mode: light-dark
  token_preset: ink-indigo
  official_paradigm: "shadcn/ui v3 官方安装范式（v3.shadcn.com/docs/installation/vite + Tailwind v4）：全局 CSS 以 @import \"tailwindcss\" 起步（Vite 插件 @tailwindcss/vite，tsconfig/vite 配 @/* 路径别名）；pnpm dlx shadcn@latest init 生成 components.json + globals.css 主题变量（--primary / --radius 等 CSS 变量 + 语义类名）与 src/lib/utils.ts（cn()）；组件用 pnpm dlx shadcn@latest add <component> 源码拷贝进 src/components/ui/（不走 babel-plugin-import 或运行时按需插件）；主题色只改 CSS 变量（--primary / --radius），页面不散落 hex 直接覆盖组件默认色"
  theme_entry:
    framework: frontend/src/main.tsx
    global_tokens: frontend/src/index.css
    components: frontend/components/ui variants + semantic Tailwind mappings
  component_baseline: [button, input, card, badge, navigation, dialog, table/list, empty/error]

architecture:
  style: layered
  pattern: modular-monolith

layout:
  source_root: .
  key_dirs:
    frontend/: "React + Vite 前端应用"
    frontend/src/: "前端源码（components、pages、hooks、lib、api）"
    frontend/public/: "Vite 官方公共静态资源目录"
    backend/: "FastAPI 后端"
    backend/app/: "FastAPI 应用包"
    backend/app/api/: "API 路由模块"
    backend/app/core/: "配置、依赖与核心逻辑"
    backend/app/models/: "SQLAlchemy 模型"
    backend/app/schemas/: "Pydantic schemas"
    backend/tests/: "pytest 测试"
  conventions: "前端遵循 Vite 官方 src/public 结构；后端遵循 FastAPI 官方推荐的应用包与路由组织。"

commands:
  install: "pnpm --dir frontend install && pip install -r backend/requirements.txt"
  dev: "pnpm --dir frontend dev"
  test: "pnpm --dir frontend test && pytest backend/tests"

starter:
  enabled: true
  mode: mock-first
  template_dirs:
    - dir: react-shadcn-web
      target: "frontend"
