# python-ml-service Blueprint v1.0.0
# Python ML Service + FastAPI + Jupyter + GPU 支持

id: python-ml-service
name: Python ML Service
version: 1.0.0
description: "AI/ML 推理和训练服务，使用 FastAPI + PyTorch + Jupyter"
author: "AI Bootstrap"
tags: [python, fastapi, ml, ai, pytorch, jupyter, gpu]

stack:
  frontend:
    framework: none
    language: none

  backend:
    framework: fastapi
    version: "0.115.x"
    language: python
    api_style: rest
    async: true
    background_tasks: celery + redis
    testing: pytest + pytest-asyncio

  ml:
    framework: pytorch
    version: "2.x"
    training: pytorch-lightning
    experiment_tracking: mlflow
    feature_store: feast
    model_registry: mlflow
    notebook: jupyter-lab
    gpu: cuda + tensorrt

  database:
    primary: postgres
    version: "16"
    vector: pgvector
    cache: redis

  deployment:
    type: docker + k8s
    ci: github-actions + dvc
    platform: "kubernetes (with GPU nodes) / modal / replicate"
    monitoring: "prometheus + grafana + wandb"

  package_manager: poetry + conda
  monorepo: none
  build_tool: makefile
  devcontainer: true

design_system:
  status: not-applicable
  rationale: no frontend is included in this Blueprint

architecture:
  style: layered
  pattern: modular-monolith

layout:
  source_root: app/
  key_dirs:
    app/: "FastAPI + ML 服务应用包"
    app/api/: "API 路由"
    app/core/: "配置、依赖与共享逻辑"
    app/models/: "ML 模型定义与推理服务"
    app/schemas/: "Pydantic 请求/响应模型"
    app/services/: "业务服务"
    notebooks/: "Jupyter Lab 实验"
    tests/: "pytest 测试"
    data/: "数据集与缓存（不入库）"
  conventions: "遵循 FastAPI 官方推荐的应用包结构，ML 代码与 API 层分离；数据产物放入 data/ 或模型注册表，不散落根目录。"

commands:
  install: "poetry install"
  dev: "uvicorn app.main:app --reload"
  test: "pytest"
