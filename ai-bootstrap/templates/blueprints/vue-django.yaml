# vue-django Blueprint v1.0.0
# Vue 前端 + Django 后端 + PostgreSQL

id: vue-django
name: Vue + Django
version: 1.0.0
description: "Vue 前端 + Django 后端 + PostgreSQL，适合快速开发内容管理和企业级应用"
author: "AI Bootstrap"
tags: [vue, django, python, javascript, web, cms]

stack:
  frontend:
    framework: vue
    version: "3.x"
    language: typescript
    build_tool: vite
    ui_library: naive-ui
    meta_framework: nuxt
    state_management: pinia
    testing: vitest

  backend:
    framework: django
    version: "5.1.x"
    language: python
    orm: django-orm
    api_style: rest + graphql
    admin: django-admin
    testing: pytest + django-test

  database:
    primary: postgres
    version: "16"
    cache: redis

  auth:
    provider: django-allauth
    strategy: session + jwt

  deployment:
    type: docker
    ci: github-actions
    platform: "vercel (frontend) + railway / fly.io (backend)"

  package_manager: pnpm + pip
  monorepo: none

design_system:
  status: required
  ui_library: naive-ui
  styling: css-variables
  icon_library: lucide-vue-next
  color_mode: light-dark
  token_preset: slate-cyan
  official_paradigm: "Naive UI 2.x 官方范式（naiveui.com 快速上手 + 主题定制）：不需要导入任何 CSS（组件独立导出、tree-shaking 友好，禁止 import naive-ui/dist/index.css 之类的全量样式）；主题入口是 n-config-provider :theme-overrides（JS 对象，GlobalThemeOverrides；暗色用 darkTheme）+ locale={zhCN} date-locale={dateZhCN}（均来自 naive-ui）；按需可配 unplugin-vue-components + NaiveUiResolver + unplugin-auto-import；主题令牌集中在一个 theme.ts 导出 themeOverrides 对象，页面不散落 hex"
  theme_entry:
    framework: frontend/src/main.ts
    global_tokens: frontend/src/styles/tokens.css
    components: NConfigProvider theme overrides + component props
  component_baseline: [button, input, card, badge, navigation, dialog, table/list, empty/error]

architecture:
  style: layered
  pattern: modular-monolith

layout:
  source_root: .
  key_dirs:
    frontend/: "Vue + Vite 前端应用"
    frontend/src/: "前端源码（components、views、stores、api）"
    frontend/public/: "Vite 公共静态资源"
    backend/: "Django 工程（manage.py + config/ + 业务 app）"
  conventions: "遵循 Django 官方项目结构：manage.py 位于工程根，项目配置包与业务 app 分离；前端遵循 Vite src/public 约定。"

commands:
  install: "pnpm --dir frontend install && pip install -r backend/requirements.txt"
  dev: "pnpm --dir frontend dev"
  test: "pnpm --dir frontend test && pytest backend"
